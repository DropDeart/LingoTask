name: Deploy PWA

# Publishes the phone version to GitHub Pages. Pages serves over HTTPS, which is what lets the
# service worker register and the browser offer "Install app" — plain LAN HTTP cannot do either.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No npm ci: the web build is plain file copying and needs no dependencies. The icons are
      # committed rather than generated, because generating them needs Electron and a display.
      - run: node build-web.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      - id: deploy
        uses: actions/deploy-pages@v4
